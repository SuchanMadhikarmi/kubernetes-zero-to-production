# Module: 06 Configuration | Lesson: 25
# A ResourceQuota capping total usage in a namespace.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: quota
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "6"
    limits.memory: 12Gi
    pods: "10"
    persistentvolumeclaims: "5"