<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" font-family="monospace" font-size="13">
  <title>Kubernetes Control Plane and Worker Nodes</title>
  <style>
    .box { fill: #eef2f7; stroke: #4a6fa5; stroke-width: 1.5; }
    .label { fill: #1b2a41; font-weight: bold; }
    .sub { fill: #5b6b7c; }
    .line { stroke: #8aa5c0; stroke-width: 1.5; }
  </style>

  <rect x="30" y="30" width="360" height="460" rx="10" class="box"/>
  <text x="210" y="60" text-anchor="middle" class="label">Control Plane</text>

  <rect x="50" y="90" width="320" height="60" rx="6" class="box"/>
  <text x="210" y="115" text-anchor="middle" class="label">API Server</text>
  <text x="210" y="135" text-anchor="middle" class="sub">authn / authz / admission</text>

  <rect x="50" y="170" width="320" height="60" rx="6" class="box"/>
  <text x="210" y="195" text-anchor="middle" class="label">etcd</text>
  <text x="210" y="215" text-anchor="middle" class="sub">source of desired state</text>

  <rect x="50" y="250" width="320" height="60" rx="6" class="box"/>
  <text x="210" y="275" text-anchor="middle" class="label">Scheduler</text>
  <text x="210" y="295" text-anchor="middle" class="sub">pod placement (filter + score)</text>

  <rect x="50" y="330" width="320" height="60" rx="6" class="box"/>
  <text x="210" y="355" text-anchor="middle" class="label">Controller-Manager</text>
  <text x="210" y="375" text-anchor="middle" class="sub">Node / ReplicaSet / Endpoints loops</text>

  <rect x="50" y="410" width="320" height="60" rx="6" class="box"/>
  <text x="210" y="435" text-anchor="middle" class="label">kube-controller-manager</text>
  <text x="210" y="455" text-anchor="middle" class="sub">cloud integration</text>

  <rect x="460" y="30" width="430" height="460" rx="10" class="box"/>
  <text x="675" y="60" text-anchor="middle" class="label">Worker Node</text>

  <rect x="480" y="90" width="390" height="60" rx="6" class="box"/>
  <text x="675" y="115" text-anchor="middle" class="label">kubelet</text>
  <text x="675" y="135" text-anchor="middle" class="sub">node agent, probes, status</text>

  <rect x="480" y="170" width="390" height="60" rx="6" class="box"/>
  <text x="675" y="195" text-anchor="middle" class="label">kube-proxy</text>
  <text x="675" y="215" text-anchor="middle" class="sub">iptables / ipvs Service routing</text>

  <rect x="480" y="250" width="390" height="60" rx="6" class="box"/>
  <text x="675" y="275" text-anchor="middle" class="label">CNI (Calico / Cilium)</text>
  <text x="675" y="295" text-anchor="middle" class="sub">pod networking + policy</text>

  <rect x="480" y="330" width="390" height="60" rx="6" class="box"/>
  <text x="675" y="355" text-anchor="middle" class="label">containerd (CRI)</text>
  <text x="675" y="375" text-anchor="middle" class="sub">container runtime</text>

  <rect x="480" y="410" width="390" height="60" rx="6" class="box"/>
  <text x="675" y="435" text-anchor="middle" class="label">Pods</text>
  <text x="675" y="455" text-anchor="middle" class="sub">apps + sidecars (Istio)</text>

  <line x1="390" y1="250" x2="460" y2="250" class="line"/>
  <text x="425" y="235" text-anchor="middle" class="sub">watch</text>
</svg>
